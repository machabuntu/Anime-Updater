name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Import every module
        # Catches syntax errors and bad imports in files the tests never reach.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/check_imports.py

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            spec: Shikimori Updater.spec
            binary: dist/Anime Updater.exe
            zip_suffix: Windows
          - os: ubuntu-latest
            spec: anime-updater-linux.spec
            binary: dist/anime-updater
            zip_suffix: Linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller --clean --noconfirm "${{ matrix.spec }}"

      - name: Report size
        shell: bash
        run: ls -lh "${{ matrix.binary }}"

      - name: Smoke test the binary
        if: runner.os == 'Linux'
        # xvfb stands in for a display so the binary can create a real window.
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
          chmod +x "${{ matrix.binary }}"
          xvfb-run -a timeout 25 "${{ matrix.binary }}" --self-test

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.zip_suffix }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

      # The in-app updater only sees assets named Anime_Updater_{version}_{OS}.zip.
      - name: Package updater zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          ZIP_SUFFIX: ${{ matrix.zip_suffix }}
          BINARY: ${{ matrix.binary }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p pkg
          cp "$BINARY" pkg/
          cp README.md LICENSE pkg/ 2>/dev/null || true
          if [ "$RUNNER_OS" = "Linux" ]; then
            chmod +x "pkg/$(basename "$BINARY")"
            cp packaging/anime-updater.desktop icon.png pkg/ 2>/dev/null || true
          fi
          python -c "import sys,zipfile; from pathlib import Path; v,s=sys.argv[1:3]; a=Path(f'Anime_Updater_{v}_{s}.zip'); z=zipfile.ZipFile(a,'w',zipfile.ZIP_DEFLATED); [z.write(p,p.name) for p in Path('pkg').iterdir()]; z.close(); print(a, a.stat().st_size)" "$version" "$ZIP_SUFFIX"

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: Anime_Updater_${{ github.ref_name }}_${{ matrix.zip_suffix }}
          path: Anime_Updater_*_${{ matrix.zip_suffix }}.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Anime_Updater_*
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/Anime_Updater_*.zip
          generate_release_notes: true
